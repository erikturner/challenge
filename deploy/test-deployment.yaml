
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-replica-server
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-replica-server
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-replica-server
  namespace: default
subjects:
  - kind: ServiceAccount
    name: kube-replica-server
    namespace: default
roleRef:
  kind: Role
  name: kube-replica-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-replica-server
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-replica-server
  template:
    metadata:
      labels:
        app: kube-replica-server
    spec:
      serviceAccountName: kube-replica-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: server
          image: kube-replica-server:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 8081
              name: health
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: kube-replica-server-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: kube-replica-server
  namespace: default
spec:
  selector:
    app: kube-replica-server
  ports:
    - name: https
      port: 8443
      targetPort: https
